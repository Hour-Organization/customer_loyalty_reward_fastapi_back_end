services:
  api:
    build: .
    # Local development: also seed the demo data into a new, empty database. The image alone only migrates.
    command: ["sh", "-c", "python -m app.cli setup && uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://root:root@pgsql:5432/customer_loyalty
      STORAGE_DIR: /app/storage/public
      APP_DEBUG: "true"
      # KHQR checkout settled through POST /api/orders/{id}/payment/simulate until Bakong is set up.
      PAYMENT_PROVIDER: fake
    volumes:
      - storage:/app/storage
    depends_on:
      pgsql:
        condition: service_healthy

  pgsql:
    image: postgres:17
    ports:
      - "${FORWARD_DB_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: customer_loyalty
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
    volumes:
      - pgsql:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-q", "-d", "customer_loyalty", "-U", "root"]
      interval: 5s
      retries: 10

volumes:
  pgsql:
  storage:
